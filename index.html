<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Order Automation Tool - Professional Edition</title>
    <!-- SheetJS Library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            max-width: 650px;
            width: 100%;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 20px;
        }
        .header h2 {
            margin: 0;
            color: var(--primary);
            font-size: 24px;
        }
        .header p {
            margin: 5px 0 0 0;
            color: var(--text-muted);
            font-size: 14px;
        }
        .upload-box {
            border: 2px dashed var(--border-color);
            padding: 30px 20px;
            text-align: center;
            border-radius: 12px;
            margin: 20px 0;
            background: #fafafa;
            transition: all 0.3s ease;
        }
        .upload-box:hover {
            border-color: var(--primary);
            background: #f8fafc;
        }
        input[type="file"] {
            margin: 15px 0;
            font-size: 14px;
            color: var(--text-muted);
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: background 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }
        button:hover {
            background: var(--primary-hover);
        }
        button:active {
            transform: scale(0.98);
        }
        #log {
            margin-top: 25px;
            white-space: pre-line;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px 20px;
            border-radius: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            color: #334155;
            max-height: 180px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h2>📊 Sales Order Automation Hub</h2>
            <p>Upload your inbound demand files & Output.xlsx template below.</p>
        </div>
    </div>
    
    <div class="upload-box">
        <label><strong>Select Inbound Excel Files + Output.xlsx Template:</strong></label><br>
        <input type="file" id="excelFiles" accept=".xlsx, .xls" multiple />
    </div>

    <button onclick="processSalesOrders()">Process & Generate Orders</button>
    
    <div id="log">Status: Ready. Please select files and click the process button.</div>
</div>

<script>
    async function processSalesOrders() {
        const fileInput = document.getElementById('excelFiles');
        const logDiv = document.getElementById('log');

        if (fileInput.files.length === 0) {
            alert("Kripya pehle Excel files select karein!");
            return;
        }

        let filesMap = {};
        for (let i = 0; i < fileInput.files.length; i++) {
            filesMap[fileInput.files[i].name.toLowerCase()] = fileInput.files[i];
        }

        if (!filesMap['output.xlsx']) {
            alert("Error: Selected files mein 'Output.xlsx' template file nahi mili! Kripya template file bhi select karein.");
            return;
        }

        logDiv.innerText = "Status: Processing started...\n";

        let templateFile = filesMap['output.xlsx'];
        let templateArrayBuffer = await templateFile.arrayBuffer();

        let totalProcessed = 0;

        for (let fileName in filesMap) {
            if (fileName === 'output.xlsx') continue;

            logDiv.innerText += `Processing: ${fileName}...\n`;
            let file = filesMap[fileName];
            let data = await file.arrayBuffer();
            let wbInput = XLSX.read(data, {type: 'array'});
            let wsInput = wbInput.Sheets[wbInput.SheetNames[0]];
            let jsonInput = XLSX.utils.sheet_to_json(wsInput, {header: 1});

            let fgRow = -1, fgCol = -1;
            for (let r = 0; r < jsonInput.length; r++) {
                for (let c = 0; c < jsonInput[r].length; c++) {
                    let val = String(jsonInput[r][c] || "").trim().toUpperCase();
                    if (val.startsWith("FG")) {
                        fgRow = r;
                        fgCol = c;
                        break;
                    }
                }
                if (fgRow !== -1) break;
            }

            if (fgRow === -1) {
                logDiv.innerText += `❌ Error in ${fileName}: 'FG' code nahi mila.\n`;
                continue;
            }

            let routeNum = "22";
            for (let r = 0; r < fgRow; r++) {
                for (let c = 0; c < 10; c++) {
                    let cellVal = String(jsonInput[r][c] || "").trim();
                    let upperVal = cellVal.toUpperCase();
                    if (cellVal !== "" && cellVal.length <= 6 && /\d/.test(cellVal) &&
                        !["SALES PERSON", "CONTACT NO:", "RT DR", "ROUTE", "MATERIAL CODE"].includes(upperVal)) {
                        routeNum = cellVal;
                        break;
                    }
                }
                if (routeNum !== "22") break;
            }

            let agencyCol = -1;
            for (let c = 0; c < fgCol; c++) {
                let headerText = String(jsonInput[fgRow - 1] ? jsonInput[fgRow - 1][c] : "").toUpperCase().replace(/\s+/g, "");
                if (headerText.includes("AG") && !headerText.includes("SALES")) {
                    agencyCol = c;
                    break;
                }
            }
            if (agencyCol === -1) agencyCol = 2;

            let validCols = [];
            for (let c = fgCol; c < jsonInput[fgRow].length; c++) {
                let fgCode = String(jsonInput[fgRow][c] || "").trim();
                let headerName = String(jsonInput[fgRow - 1] ? jsonInput[fgRow - 1][c] : "").trim().toUpperCase();
                
                if (headerName.includes("TOTAL") || headerName.includes("REMARK") || !fgCode.toUpperCase().startsWith("FG")) {
                    break;
                }
                validCols.push(c);
            }

            let clonedBuffer = templateArrayBuffer.slice(0);
            let templateWb = XLSX.read(clonedBuffer, {type: 'array', cellStyles: true, cellNF: true});
            let sheetName = templateWb.SheetNames.includes("Order Data") ? "Order Data" : templateWb.SheetNames[0];
            let templateWs = templateWb.Sheets[sheetName];

            let salesOrderNum = 1;
            let rowIdx = 5;
            let todayDate = new Date().toISOString().slice(0, 10);

            for (let r = fgRow + 1; r < jsonInput.length; r++) {
                let agency = jsonInput[r][agencyCol];
                if (agency !== undefined && agency !== "" && !isNaN(agency)) {
                    let itemID = 10;
                    let rowHasItems = false;

                    for (let c of validCols) {
                        let skuQty = Number(jsonInput[r][c]);
                        if (skuQty > 0) {
                            rowHasItems = true;
                            let fgName = String(jsonInput[fgRow][c]).trim();

                            function setCellClean(rIndex, cIndex, val) {
                                let cellRef = XLSX.utils.encode_cell({r: rIndex, c: cIndex});
                                if (!templateWs[cellRef]) {
                                    templateWs[cellRef] = { t: typeof val === 'number' ? 'n' : 's', v: val };
                                } else {
                                    let existingStyle = templateWs[cellRef].s;
                                    templateWs[cellRef].v = val;
                                    templateWs[cellRef].t = typeof val === 'number' ? 'n' : 's';
                                    if (existingStyle) templateWs[cellRef].s = existingStyle;
                                }
                            }

                            setCellClean(rowIdx, 1, salesOrderNum);
                            setCellClean(rowIdx, 2, "OR");
                            setCellClean(rowIdx, 3, "SO20");
                            setCellClean(rowIdx, 4, 10);
                            setCellClean(rowIdx, 5, 20);
                            setCellClean(rowIdx, 6, "DR" + agency);
                            setCellClean(rowIdx, 7, "DR" + agency);
                            setCellClean(rowIdx, 8, "REF-" + agency + "-" + todayDate);
                            setCellClean(rowIdx, 9, todayDate);
                            setCellClean(rowIdx, 10, todayDate);
                            setCellClean(rowIdx, 14, itemID);
                            setCellClean(rowIdx, 15, fgName);
                            setCellClean(rowIdx, 18, skuQty);
                            setCellClean(rowIdx, 19, "Bag");
                            setCellClean(rowIdx, 21, 2100);
                            setCellClean(rowIdx, 25, routeNum);
                            setCellClean(rowIdx, 26, agency);

                            itemID += 10;
                            rowIdx++;
                        }
                    }
                    if (rowHasItems) salesOrderNum++;
                }
            }

            let range = XLSX.utils.decode_range(templateWs['!ref'] || "A1:Z1");
            if (rowIdx > range.e.r) {
                range.e.r = rowIdx;
                templateWs['!ref'] = XLSX.utils.encode_range(range);
            }

            let safeRoute = String(routeNum).replace(/[\/\\?%*:|"<>]/g, "-");
            let timeStamp = new Date().toTimeString().slice(0,8).replace(/:/g,"");
            XLSX.writeFile(templateWb, `${safeRoute}_${todayDate}_${timeStamp}.xlsx`, { cellStyles: true });
            
            totalProcessed++;
            logDiv.innerText += `✅ Success: ${fileName} processed.\n`;
        }

        logDiv.innerText += `\n🎉 All Done! Total ${totalProcessed} files processed & downloaded.`;
    }
</script>

</body>
</html>
